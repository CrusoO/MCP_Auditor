[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "1.0.0"
description = "Zero-Trust MCP Governance Gateway – intercepts, evaluates, and audits every LLM tool call."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "AgentGuard Team" }]

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # --- MCP framework ---
    "fastmcp>=2.0.0",

    # --- Async HTTP client (upstream MCP proxy) ---
    "httpx>=0.27.0",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # --- Validation ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # --- Observability ---
    "structlog>=24.2.0",
]

[project.optional-dependencies]
# NLP-based PII detection (heavier – requires spaCy model download)
presidio = [
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7.0",
]

# Development & testing
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",    # async test client
    "factory-boy>=3.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
agentguard = "proxy.gateway:app"

# ---------------------------------------------------------------------------
# uv workspace configuration
# ---------------------------------------------------------------------------
[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E", "F", "W",    # pycodestyle + pyflakes
    "I",              # isort
    "UP",             # pyupgrade
    "B",              # flake8-bugbear
    "SIM",            # flake8-simplify
    "ANN",            # flake8-annotations (type hints)
    "S",              # bandit security checks
]
ignore = [
    "ANN101",  # self type annotation not required
    "ANN102",  # cls type annotation not required
    "S101",    # allow assert in tests
]

[tool.ruff.per-file-ignores]
"tests/*" = ["ANN", "S"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=proxy --cov=db --cov-report=term-missing -v"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["proxy", "db"]
omit = ["*/tests/*", "mock_server/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
